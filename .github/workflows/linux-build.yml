# Builds Mutant Video Producer on Linux (Ubuntu 24.04: Qt 6.4 and FFmpeg 6.1 from its own
# packages) and runs the self-tests that need no GPU, on every push to main, so the
# Linux build keeps working. Every build is also packaged as an AppImage
# (Qt and FFmpeg inside, runs on most distributions from 2024 on); version tags attach it,
# with the tar.gz, to the release.
name: Linux build

on:
  push:
    tags: ['v*']
    branches: ['main']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config \
               qt6-base-dev qt6-multimedia-dev libqt6opengl6-dev libgl-dev qmake6 \
               libavdevice-dev libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev libswscale-dev libswresample-dev ffmpeg

      # The tag's version (v0.2.6 -> 0.2.6) goes into the program and the file names; other builds are dev-<commit>.
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "MVP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh Release

      # Off-screen (no display); the GPU suites are left out (the runner draws OpenGL in software).
      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          tests/make_test_media.sh ffmpeg testmedia > /dev/null
          bin=build/Release/bin/mvp_selftest
          out=build/ci
          failed=0
          run() { echo "::group::$1"; "$bin" "$@" || failed=1; echo "::endgroup::"; }
          run probe testmedia/h264_aac.mp4 testmedia/vp8_vorbis.webm
          run generators $out/gen
          run effects testmedia/h264_aac.mp4 $out/fx
          run speed testmedia/h264_aac.mp4 $out/speed
          run editing testmedia $out/edit
          run audiofx testmedia $out/afx
          run envelopes testmedia $out/env
          run ramps testmedia $out/ramps
          run presets testmedia $out/presets
          run random
          run beats
          run docs docs data/examples src
          run harden testmedia data/examples $out/harden 500
          build/Release/bin/mvp_collection_test || failed=1
          build/Release/bin/mvp_brand_test || failed=1
          build/Release/bin/mvp_finishing_test || failed=1
          build/Release/bin/mvp_keyframes_test || failed=1
          build/Release/bin/mvp_graphics_test || failed=1
          build/Release/bin/mvp_motion_test || failed=1
          python3 -m unittest discover -s tests -p test_ci_builds.py || failed=1
          exit $failed

      - name: Package Linux build
        run: |
          mkdir -p build/package/MutantVideoProducer
          cp -a build/Release/bin/. build/package/MutantVideoProducer/
          find build/package/MutantVideoProducer -maxdepth 1 -type f -name 'mvp_*test' -delete
          cp README.md LICENSE CHANGELOG.md build/package/MutantVideoProducer/
          printf '%s\n' 'Built for Ubuntu 24.04 x86_64 with system Qt 6 and FFmpeg 6.1.' \
            'Install runtime dependencies: sudo apt install qt6-base-dev qt6-multimedia-dev libqt6opengl6-dev ffmpeg' \
            'Run: ./MutantVideoProducer' \
            'Optional AI workers/models are not bundled in this Linux archive.' \
            > build/package/MutantVideoProducer/BUILD-NOTES.txt
          tar -C build/package -czf build/MutantVideoProducer-linux-x86_64.tar.gz MutantVideoProducer

      # linuxdeploy (pinned, checksum verified) puts the program, Qt with its plugins and FFmpeg
      # in one file. The program's data (docs, examples, models, voice) stays next to it in usr/bin.
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runner
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
        run: |
          cd build
          curl -sfLO https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -sfLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum -c
          echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp -a package/MutantVideoProducer/. AppDir/usr/bin/
          rm AppDir/usr/bin/MutantVideoProducer AppDir/usr/bin/BUILD-NOTES.txt
          ffmpeg -v error -i ../data/mvp-icon.png -vf scale=256:256 mutant-video-producer.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Mutant Video Producer' \
            'Comment=Edit videos, compose animated graphics, finish audio and perform live visuals' \
            'Exec=MutantVideoProducer %F' 'Icon=mutant-video-producer' 'Categories=AudioVideo;Video;AudioVideoEditing;' \
            'Terminal=false' > mutant-video-producer.desktop
          export QMAKE="$(command -v qmake6)" LDAI_OUTPUT="MutantVideoProducer-$MVP_VERSION-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e Release/bin/MutantVideoProducer \
            -d mutant-video-producer.desktop -i mutant-video-producer.png --plugin qt --output appimage
          test -s "$LDAI_OUTPUT"

      # The AppImage starts, draws its window off-screen, saves it and quits.
      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 120 "build/MutantVideoProducer-$MVP_VERSION-x86_64.AppImage" --screenshot "$PWD/build/appimage.png"
          test -s build/appimage.png

      - name: Store development build downloads
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/store-ci-build.py build/MutantVideoProducer-linux-x86_64.tar.gz "build/MutantVideoProducer-$MVP_VERSION-x86_64.AppImage"

      - name: Checksums
        if: github.ref_type == 'tag'
        run: |
          cd build
          for f in MutantVideoProducer-linux-x86_64.tar.gz "MutantVideoProducer-$MVP_VERSION-x86_64.AppImage"; do sha256sum --binary "$f" > "$f.sha256"; done

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MutantVideoProducer-*-x86_64.AppImage
            build/MutantVideoProducer-*-x86_64.AppImage.sha256
            build/MutantVideoProducer-linux-x86_64.tar.gz
            build/MutantVideoProducer-linux-x86_64.tar.gz.sha256
