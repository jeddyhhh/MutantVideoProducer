# Builds Mutant Video Producer on Linux (Ubuntu 24.04: Qt 6.4 and FFmpeg 6.1 from its own
# packages) and runs the self-tests that need no GPU, on every push and pull
# request, so the Linux build keeps working.
name: Linux build

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config \
               qt6-base-dev qt6-multimedia-dev libqt6opengl6-dev libgl-dev \
               libavdevice-dev libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev libswscale-dev libswresample-dev ffmpeg

      - name: Build
        run: ./build.sh Release

      # Off-screen (no display); the GPU suites are left out (the runner draws OpenGL in software).
      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          tests/make_test_media.sh ffmpeg testmedia > /dev/null
          bin=build/Release/bin/mvp_selftest
          out=build/ci
          failed=0
          run() { echo "::group::$1"; "$bin" "$@" || failed=1; echo "::endgroup::"; }
          run probe testmedia/h264_aac.mp4 testmedia/vp8_vorbis.webm
          run generators $out/gen
          run effects testmedia/h264_aac.mp4 $out/fx
          run speed testmedia/h264_aac.mp4 $out/speed
          run editing testmedia $out/edit
          run audiofx testmedia $out/afx
          run envelopes testmedia $out/env
          run ramps testmedia $out/ramps
          run presets testmedia $out/presets
          run random
          run beats
          run docs docs data/examples src
          run harden testmedia data/examples $out/harden 500
          build/Release/bin/mvp_collection_test || failed=1
          build/Release/bin/mvp_brand_test || failed=1
          build/Release/bin/mvp_finishing_test || failed=1
          build/Release/bin/mvp_graphics_test || failed=1
          build/Release/bin/mvp_motion_test || failed=1
          python3 -m unittest discover -s tests -p test_ci_builds.py || failed=1
          exit $failed

      - name: Package Linux build
        run: |
          mkdir -p build/package/MutantVideoProducer
          cp -a build/Release/bin/. build/package/MutantVideoProducer/
          find build/package/MutantVideoProducer -maxdepth 1 -type f -name 'mvp_*test' -delete
          cp README.md LICENSE CHANGELOG.md build/package/MutantVideoProducer/
          printf '%s\n' 'Built for Ubuntu 24.04 x86_64 with system Qt 6 and FFmpeg 6.1.' \
            'Install runtime dependencies: sudo apt install qt6-base-dev qt6-multimedia-dev libqt6opengl6-dev ffmpeg' \
            'Run: ./MutantVideoProducer' \
            'Optional AI workers/models are not bundled in this Linux archive.' \
            > build/package/MutantVideoProducer/BUILD-NOTES.txt
          tar -C build/package -czf build/MutantVideoProducer-linux-x86_64.tar.gz MutantVideoProducer

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: mvp-linux-x86_64
          path: build/MutantVideoProducer-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Store development build downloads
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/store-ci-build.py build/MutantVideoProducer-linux-x86_64.tar.gz
