# Builds Mutant Video Producer for Windows and publishes an installer and a zip (MutantVideoProducer.exe +
# Qt + FFmpeg + MSVC runtime) on a GitHub release when a version tag such as v0.1.0 is pushed.
# Publishing an already-tested release does not start another build. Main/feature branch pushes
# and manual branch runs store tested downloads in a draft development release.
# The offline edition (frozen AI engines and Whisper models, several GB) is built only for
# milestones: run this workflow manually on the version tag with "offline" ticked.
name: Windows release

on:
  push:
    tags: ['v*']
    branches: ['main', 'codex/**', 'claude/**'] # main and feature-branch build artifacts
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      offline:
        description: 'Milestone: also build the offline edition (run on a version tag)'
        type: boolean
        default: false

permissions:
  contents: write

# Keep only the newest run for a branch or version tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      OFFLINE: ${{ github.ref_type == 'tag' && inputs.offline == true }}
    steps:
      - uses: actions/checkout@v4

      # Qt 6.8+: older Qt headers use stdext::checked_array_iterator, which the
      # Visual Studio 2026 compiler on the runner no longer has.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          dir: ${{ github.workspace }}/deps
          cache: true

      - name: Download FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/download-ffmpeg.ps1

      # Optional parts, each left out of the build when missing: speech to text
      # (auto captions), person segmentation (Remove Background), VST3 plugins.
      - name: Download whisper.cpp, ONNX Runtime and the VST3 interfaces
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue' # (the progress bar slows big downloads right down)
          Invoke-WebRequest https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.5.zip -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath deps
          Rename-Item deps/whisper.cpp-1.9.5 whisper
          # ONNX Runtime with DirectML (the model on any DirectX 12 GPU, else the CPU), as deps/onnxruntime/{include,lib}.
          $nuget = 'https://api.nuget.org/v3-flatcontainer'
          Invoke-WebRequest "$nuget/microsoft.ml.onnxruntime.directml/1.24.4/microsoft.ml.onnxruntime.directml.1.24.4.nupkg" -OutFile ortdml.zip
          Invoke-WebRequest "$nuget/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile dml.zip
          Expand-Archive ortdml.zip -DestinationPath ortdml
          Expand-Archive dml.zip -DestinationPath dml
          New-Item -ItemType Directory -Force deps/onnxruntime/include, deps/onnxruntime/lib | Out-Null
          Copy-Item ortdml/build/native/include/* deps/onnxruntime/include
          Copy-Item ortdml/runtimes/win-x64/native/* deps/onnxruntime/lib
          Copy-Item dml/bin/x64-win/DirectML.dll deps/onnxruntime/lib
          Copy-Item ortdml/LICENSE deps/onnxruntime/LICENSE
          Copy-Item dml/LICENSE.txt deps/onnxruntime/DIRECTML-LICENSE.txt
          git clone --depth 1 https://github.com/steinbergmedia/vst3_pluginterfaces.git deps/vst3/pluginterfaces

      # To build Whisper's Vulkan backend (auto captions on the GPU); users need only a graphics driver.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          Start-Process ./vulkan-sdk.exe -Wait -ArgumentList '--root', 'C:/VulkanSDK/1.4.363.0', '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          "VULKAN_SDK=C:/VulkanSDK/1.4.363.0" >> $env:GITHUB_ENV

      # The tag's version (v0.2.5 -> 0.2.5) goes into the program (Help > About, the update check)
      # and the file names; other builds are dev-<commit>.
      - name: Version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "MVP_VERSION=$version" >> $env:GITHUB_ENV
          $bundle = if ($env:OFFLINE -eq 'true') { 'ON' } else { 'OFF' }
          "MVP_BUNDLE_AI=$bundle" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore packaged AI workers
        if: env.OFFLINE == 'true'
        id: worker_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/voice-worker/mvp-voice-worker
            deps/rvc-worker/mvp-rvc-worker
          key: ai-workers-${{ runner.os }}-py312-${{ hashFiles('scripts/build-voice-worker.ps1', 'scripts/build-rvc-worker.ps1', 'data/voice/worker.py', 'data/voice/requirements.txt', 'data/rvc/**') }}

      - name: Build local voice worker
        if: env.OFFLINE == 'true' && steps.worker_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-voice-worker.ps1

      - name: Build bundled RVC engine
        if: env.OFFLINE == 'true' && steps.worker_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-rvc-worker.ps1

      - name: Cache packaged AI workers
        if: env.OFFLINE == 'true' && steps.worker_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/voice-worker/mvp-voice-worker
            deps/rvc-worker/mvp-rvc-worker
          key: ${{ steps.worker_cache.outputs.cache-primary-key }}

      - name: Prepare verified AI setup helper
        shell: pwsh
        run: ./scripts/download-ai-bootstrap.ps1

      - name: Prepare YouTube JavaScript runtime
        shell: pwsh
        run: ./scripts/download-youtube-runtime.ps1

      - name: Remove packaged worker build intermediates
        shell: pwsh
        run: |
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          foreach ($relativePath in 'deps/voice-worker-env', 'deps/rvc-worker-env', 'build/voice-worker', 'build/rvc-worker') {
              $workerBuildPath = [IO.Path]::GetFullPath((Join-Path $workspaceRoot $relativePath))
              if (-not $workerBuildPath.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Worker build path is outside the workspace' }
              if (Test-Path -LiteralPath $workerBuildPath) { Remove-Item -LiteralPath $workerBuildPath -Recurse -Force }
          }

      - name: Build
        shell: cmd
        # Build the complete app and every test used below. Composer/GPU suites
        # run separately on Linux; avoid redundant MSVC whole-program links here.
        run: build.bat Release mvp mvp_selftest mvp_collection_test mvp_brand_test mvp_finishing_test mvp_voice_test mvp_runtime_test mvp_docs

      # The native windows platform (no window is shown): offscreen has no fonts on Windows.
      - name: Self-test
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $bin = 'build/Release/bin'
          New-Item -ItemType Directory -Force testmedia, build/ci | Out-Null
          deps/ffmpeg/bin/ffmpeg.exe -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 `
              -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest testmedia/h264_aac.mp4
          & "$bin/mvp_selftest.exe" probe testmedia/h264_aac.mp4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/mvp_selftest.exe" generators build/ci/gen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/mvp_selftest.exe" youtube-options
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/mvp_collection_test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/mvp_brand_test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/mvp_finishing_test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/mvp_runtime_test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_ai_packaging.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_ci_builds.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_voice_worker.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:MVP_AI_RUNTIME_DIR = "$PWD/build/ci/ai-engines"
          & "$bin/mvp_runtime_test.exe" --install speech cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/mvp_runtime_test.exe" --cancel-repair speech cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/download-voice-assets.py --output build/ci/voice-assets --voice-id af_heart
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:MVP_VOICE_DIR = "$PWD/build/ci/voice-assets"
          & "$bin/mvp_voice_test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Prepare standalone installer payload
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:MVP_VERSION
          $bin = 'build/Release/bin'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Copy-Item "$($crt.FullName)/*.dll" $bin
          Copy-Item deps/ffmpeg/LICENSE.txt "$bin/FFMPEG-LICENSE.txt"
          Copy-Item deps/onnxruntime/LICENSE "$bin/ONNXRUNTIME-LICENSE.txt"
          Copy-Item deps/onnxruntime/DIRECTML-LICENSE.txt "$bin/DIRECTML-LICENSE.txt"
          Copy-Item deps/whisper/LICENSE "$bin/WHISPER-LICENSE.txt"
          Copy-Item README.md, LICENSE, CHANGELOG.md $bin
          python scripts/package-windows.py --bin $bin --output build/distribution --version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "directory=$PWD/build/distribution/MutantVideoProducer-$version-win64" >> $env:GITHUB_OUTPUT

      - name: Build small Windows installer
        id: installer
        shell: pwsh
        run: |
          $version = $env:MVP_VERSION
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=${{ steps.package.outputs.directory }}" "/O$PWD/build/distribution" installer/mvp.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = "build/distribution/MutantVideoProducer-$version-win64-setup.exe"
          if ((Get-Item $setup).Length -ge 1GB) { throw 'Installer exceeds the 1 GiB size budget' }
          $files = @(Get-Content build/distribution/files.json -Raw | ConvertFrom-Json)
          $files += (Split-Path $setup -Leaf)
          $files | ConvertTo-Json | Set-Content build/distribution/files.json
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$(Split-Path $setup -Leaf)" | Set-Content "$setup.sha256" -Encoding ascii
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "### Windows installer`n`nSize: $([math]::Round((Get-Item $setup).Length / 1MB,1)) MiB. AI engines download directly from upstream sources through Tools > AI Components. The installer is a single EXE." >> $env:GITHUB_STEP_SUMMARY

      - name: Complete offline edition (milestones)
        if: env.OFFLINE == 'true'
        shell: pwsh
        run: |
          $version = $env:MVP_VERSION
          $ProgressPreference = 'SilentlyContinue'
          $off = "build/distribution/MutantVideoProducer-$version-win64-offline"
          Copy-Item -Recurse "${{ steps.package.outputs.directory }}" $off
          Copy-Item -Recurse build/Release/bin/voice/worker "$off/voice/worker"
          Copy-Item -Recurse build/Release/bin/voice/rvc-worker "$off/voice/rvc-worker"
          python scripts/download-voice-assets.py --output "$off/voice/assets"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/download-voice-assets.py --catalog data/rvc/catalog.json --output "$off/voice/assets"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory "$off/models/whisper" | Out-Null
          $hf = 'https://huggingface.co'
          foreach ($url in "$hf/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin", "$hf/ggerganov/whisper.cpp/resolve/main/ggml-base.bin",
                           "$hf/ggerganov/whisper.cpp/resolve/main/ggml-small.bin",
                           "$hf/akashmjn/tinydiarize-whisper.cpp/resolve/main/ggml-small.en-tdrz.bin") {
              Invoke-WebRequest $url -OutFile "$off/models/whisper/$(Split-Path $url -Leaf)"
          }
          7z a -tzip -mx=1 "$off.zip" $off | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import importlib.util,pathlib; s=importlib.util.spec_from_file_location('pack','scripts/package-windows.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); p=pathlib.Path('$off.zip'); digest=m.sha256(p); size=p.stat().st_size; parts=m.split_archive(p); p.with_name(p.name+'.sha256').write_text(digest+' *'+p.name+'\n',encoding='ascii')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item scripts/join-build-parts.py build/distribution/

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        continue-on-error: true
        with:
          name: mvp-win64
          compression-level: 0 # the files are already compressed archives/installers
          path: |
            build/distribution/*.exe
            build/distribution/*.zip
            build/distribution/*.part*
            build/distribution/*.sha256
            build/distribution/*.py

      - name: Store development build downloads
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-Content build/distribution/files.json -Raw | ConvertFrom-Json
          $paths = @($files | ForEach-Object { Join-Path 'build/distribution' $_ })
          python scripts/store-ci-build.py @paths
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distribution/*.exe
            build/distribution/*.zip
            build/distribution/*.part*
            build/distribution/*.sha256
            build/distribution/*.py
          generate_release_notes: true
